<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Excel Chart Viewer</title>

  <!-- XLSX library to read Excel files -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Chart.js for plotting -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #chartContainer { width: 80%; margin-top: 40px; }
  </style>
</head>

<body>
  <h2>📊 Excel Chart Viewer (GitHub Pages Compatible)</h2>

  <input type="file" id="fileInput" accept=".xlsx,.xls" />
  <br><br>

  <label>Select numeric column:</label>
  <select id="columnSelect"></select>

  <div id="chartContainer">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    let sheetData = [];
    let chart;

    document.getElementById("fileInput").addEventListener("change", handleFile);

    function handleFile(event) {
      const file = event.target.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        sheetData = XLSX.utils.sheet_to_json(firstSheet);

        populateColumnSelect();
      };

      reader.readAsArrayBuffer(file);
    }

    function populateColumnSelect() {
      const select = document.getElementById("columnSelect");
      select.innerHTML = "";

      if (sheetData.length === 0) return;

      const numericCols = Object.keys(sheetData[0]).filter(col =>
        typeof sheetData[0][col] === "number"
      );

      if (numericCols.length === 0) {
        alert("No numeric columns found in this Excel file.");
        return;
      }

      numericCols.forEach(col => {
        const option = document.createElement("option");
        option.value = col;
        option.textContent = col;
        select.appendChild(option);
      });

      select.onchange = drawChart;
      drawChart();
    }

    function drawChart() {
      const col = document.getElementById("columnSelect").value;
      const labels = sheetData.map((_, i) => i + 1);
      const values = sheetData.map(row => row[col]);

      if (chart) chart.destroy();

      const ctx = document.getElementById("myChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: col,
            data: values,
            borderWidth: 2,
          }],
        },
      });
    }
  </script>
</body>
</html>
