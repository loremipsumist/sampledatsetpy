<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Excel Chart Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 40px auto;
        }
        canvas {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h2>📊 Create a Chart From an Excel File</h2>

<p>Upload an Excel (.xlsx) file and choose a column to chart.</p>

<input type="file" id="fileInput" accept=".xlsx,.xls">

<br><br>
<label>Select numeric column:</label>
<select id="columnSelect"></select>

<canvas id="chart" width="800" height="400"></canvas>

<script>
let dataFrame = [];
let chart;

// Read Excel on upload
document.getElementById('fileInput').addEventListener('change', handleFile);

function handleFile(event) {
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        dataFrame = XLSX.utils.sheet_to_json(sheet);

        populateColumnSelector();
    };

    reader.readAsArrayBuffer(file);
}

// Fill dropdown with numeric columns
function populateColumnSelector() {
    const select = document.getElementById("columnSelect");
    select.innerHTML = "";

    if (dataFrame.length === 0) return;

    const columns = Object.keys(dataFrame[0]);

    columns.forEach(col => {
        // Check if column has numeric values
        const isNumeric = dataFrame.some(row => !isNaN(parseFloat(row[col])));

        if (isNumeric) {
            const option = document.createElement("option");
            option.value = col;
            option.textContent = col;
            select.appendChild(option);
        }
    });

    select.addEventListener("change", drawChart);
}

// Draw chart using Chart.js
function drawChart() {
    const col = document.getElementById("columnSelect").value;

    const labels = dataFrame.map((_, i) => i + 1);
    const values = dataFrame.map(row => parseFloat(row[col]) || 0);

    if (chart) chart.destroy();

    const ctx = document.getElementById("chart").getContext("2d");

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: col,
                data: values,
                borderWidth: 2
            }]
        }
    });
}
</script>

</body>
</html>
